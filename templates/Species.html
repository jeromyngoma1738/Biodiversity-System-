{% extends "base.html" %}

{% block title %}
SPECIE OBSERVATION
{% endblock %}

{% block css %}

<link rel="stylesheet"
href="{{ url_for('static', filename='speciestyle.css') }}">
{% endblock %}



{% block content %}
<header>
    <nav class="navbar">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('login') }}">log Out</a>
    </nav>
    <br>
</header>

<div class="container">


<div class="form-box active">

    <form method="POST" enctype="multipart/form-data">

        <br>
        <h2>Enter new Specie in the System </h2>

        <input type="text"  name="Specie_Scientific_Name" placeholder=" Specie Scientific name " required>
        <input type="text"  name="Specie_Common_Name" placeholder="Specie Common Name" required>
        <input type="number"  name="population"  placeholder="Specie Population" required>

        <input type="text"  name="observer"  placeholder="Name of the Observer" required>

        <input type="file"  name="image"  placeholder="Species Image" required>
         
        <textarea name="note" rows="4" cols="40" placeholder="Please enter your notes here..."></textarea>

        <button type="submit">
            submit 
        </button>


    </form>

</div>


</div>

{% endblock %}
