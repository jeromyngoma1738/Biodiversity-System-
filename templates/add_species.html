{% extends "base.html" %}

{% block title %}
Species Database
{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='loginStyle.css') }}">
{% endblock %}

{% block content %}
<h2>Add New Species</h2>
<div class="form-box active">

<form action="{{ url_for('add_species') }}" method="POST">

    <label>Scientific Name</label><br>
    <input type="text" name="scientificName" required><br><br>

    <label>Common Name</label><br>
    <input type="text" name="commonName" required><br><br>

    <label>Habitat</label><br>
    <input type="text" name="habitat" required><br><br>

    <label>Location</label><br>
    <input type="text" name="location" required><br><br>

    <button type="submit">Add Species</button>

</form>
</div>
<hr>
{% endblock %}
